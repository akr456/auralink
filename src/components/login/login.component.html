<div class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 p-4">
  <div class="w-full max-w-sm">
    <div class="bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm p-8 space-y-6">
      <div class="flex flex-col items-center space-y-2">
        <div class="w-14 h-14 rounded-lg bg-slate-900 dark:bg-slate-50 flex items-center justify-center text-4xl font-bold text-slate-50 dark:text-slate-900">
          A
        </div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-50">Welcome to AuraLink</h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm">Enter a username to begin.</p>
      </div>

      <form (submit)="login()" class="space-y-4">
        <div>
          <label for="username" class="block text-xs font-medium text-slate-700 dark:text-slate-400 mb-2">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            [(ngModel)]="username"
            (ngModelChange)="username.set($event)"
            required
            class="w-full h-10 px-3 py-2 bg-transparent border border-slate-300 dark:border-slate-700 rounded-md text-sm text-slate-900 dark:text-slate-50 placeholder:text-slate-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 dark:focus-visible:ring-slate-300 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-950"
            placeholder="e.g., alex_johnson"
          />
        </div>

        <button 
          type="submit"
          [disabled]="!username().trim()"
          class="w-full h-10 inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed bg-slate-900 text-slate-50 hover:bg-slate-900/90 dark:bg-slate-50 dark:text-slate-900 dark:hover:bg-slate-50/90"
        >
          <span>Enter AuraLink</span>
          <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 9l4 4m0 0l-4 4m4-4H3"></path></svg>
        </button>
      </form>
    </div>
    <p class="text-center text-xs text-slate-500 dark:text-slate-400 mt-6">
      This is a demo application. No password is required.
    </p>
  </div>
</div>
