@if (post(); as p) {
  <article class="bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-5 transition-colors hover:border-slate-300 dark:hover:border-slate-700">
    <!-- Post Header -->
    <div class="flex items-center mb-4">
      <img [src]="p.author.avatarUrl" alt="author avatar" class="w-10 h-10 rounded-full mr-4 border-2 border-slate-300 dark:border-slate-700">
      <div>
        <h3 class="font-semibold text-sm text-slate-900 dark:text-slate-50">{{ p.author.name }}</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400">{{ getRelativeTime(p.timestamp) }} ago</p>
      </div>
    </div>
    
    <!-- Post Content -->
    <p class="text-slate-700 dark:text-slate-300 whitespace-pre-wrap mb-4 text-base">{{ p.content }}</p>
    
    <!-- Post Actions -->
    <div class="flex items-center text-slate-500 dark:text-slate-400 space-x-6 border-t border-slate-200 dark:border-slate-800 pt-3 text-sm">
      <button class="flex items-center space-x-2 hover:text-pink-500 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
        <span class="font-medium">{{ p.likes }}</span>
      </button>
      <button class="flex items-center space-x-2 hover:text-cyan-400 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
        <span class="font-medium">{{ p.comments }}</span>
      </button>
      <button class="flex items-center space-x-2 hover:text-green-400 transition-colors ml-auto">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12s-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.368a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684z"></path></svg>
        <span class="font-medium">Share</span>
      </button>
    </div>
  </article>
}
