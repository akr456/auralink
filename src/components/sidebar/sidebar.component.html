<div class="p-4 flex flex-col h-full">
  <!-- Header -->
  <div class="flex items-center mb-6">
    <div class="w-10 h-10 rounded-lg bg-slate-900 dark:bg-slate-50 flex items-center justify-center text-xl font-bold text-slate-50 dark:text-slate-900">
      A
    </div>
    <h1 class="ml-3 text-2xl font-bold tracking-tighter text-slate-900 dark:text-slate-50">AuraLink</h1>
  </div>

  <!-- Aura List -->
  <nav class="flex-1">
    <h2 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2 px-2">Your Auras</h2>
    <ul>
      @for (aura of auras(); track aura.id) {
        <li class="mb-1">
          <button 
            (click)="selectAura(aura)"
            [class]="'w-full text-left flex items-center p-2 rounded-md transition-colors ' + (selectedAura()?.id === aura.id 
              ? 'bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-slate-50 font-semibold' 
              : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200/70 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-slate-50')">
            <span class="text-lg w-6 text-center mr-3">{{ aura.icon }}</span>
            <span class="">{{ aura.name }}</span>
          </button>
        </li>
      }
    </ul>
  </nav>

  <!-- Discover & User Section -->
  <div class="mt-auto border-t border-slate-200 dark:border-slate-800 pt-4 space-y-4">
      <div>
        <h2 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2 px-2">Discover</h2>
        <button (click)="discoverAuras()" [disabled]="isLoading()" class="w-full bg-slate-900 text-slate-50 hover:bg-slate-800 dark:bg-slate-50 dark:text-slate-900 dark:hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed font-bold py-2 px-4 rounded-lg flex items-center justify-center transition-colors">
          @if (isLoading()) {
            <app-loader></app-loader>
            <span class="ml-2">Thinking...</span>
          } @else {
            <span class="text-md mr-2">✨</span>
            <span>Suggest Auras</span>
          }
        </button>
      </div>

    @if (currentUser(); as user) {
        <div class="flex items-center justify-between p-2">
            <div class="flex items-center">
                <img [src]="user.avatarUrl" [alt]="user.name + ' avatar'" class="w-9 h-9 rounded-full border-2 border-slate-300 dark:border-slate-700">
                <span class="ml-3 font-semibold text-sm">{{ user.name }}</span>
            </div>
            <div class="flex items-center space-x-1">
                <button (click)="toggleTheme()" class="p-2 rounded-md hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-slate-500 dark:text-slate-400" [title]="'Switch to ' + (theme() === 'dark' ? 'light' : 'dark') + ' mode'">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>
                 <button (click)="logout()" class="p-2 rounded-md hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-slate-500 dark:text-slate-400" title="Logout">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </div>
    }
  </div>
</div>
